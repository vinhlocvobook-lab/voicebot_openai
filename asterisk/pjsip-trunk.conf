; ═══════════════════════════════════════════════════════════════════════════
; Asterisk PJSIP – Cấu hình SIP Trunk kết nối với OpenAI Realtime SIP
; Tài liệu OpenAI: https://developers.openai.com/api/docs/guides/realtime-sip
;
; Thay <PROJECT_ID> bằng project ID thật từ platform.openai.com > Project > General
; ═══════════════════════════════════════════════════════════════════════════

; ── 1. Transport (TLS bắt buộc theo OpenAI) ──────────────────────────────────
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
; cert_file=/etc/asterisk/certs/asterisk.crt
; priv_key_file=/etc/asterisk/certs/asterisk.key
; ca_list_file=/etc/ssl/certs/ca-certificates.crt
method=tlsv1_2

; ── 2. AOR (Address of Record) – nơi gửi/nhận SIP đến OpenAI ─────────────────
[openai-trunk-aor]
type=aor
contact=sip:<PROJECT_ID>@sip.api.openai.com;transport=tls
qualify_frequency=60

; ── 3. Auth – OpenAI SIP không yêu cầu SIP auth (xác thực qua API key phía webhook)
; Để trống, không cần [openai-trunk-auth]

; ── 4. Endpoint – định nghĩa trunk ra OpenAI ─────────────────────────────────
[openai-trunk]
type=endpoint
transport=transport-tls
aors=openai-trunk-aor
; Codec: OpenAI Realtime SIP hỗ trợ PCMU (G.711 µ-law) và PCMA (G.711 A-law)
allow=!all,ulaw,alaw
; DTMF: RFC2833
dtmf_mode=rfc4733
; Không cần auth
outbound_auth=
; Context nhận cuộc gọi vào từ OpenAI (nếu có)
context=from-openai

; ── 5. Identify – nhận diện traffic từ OpenAI SIP ────────────────────────────
[openai-identify]
type=identify
endpoint=openai-trunk
; OpenAI SIP IP ranges (xem docs) – thêm tất cả vào đây
match=13.79.45.80/28
match=23.98.140.64/28
match=40.67.149.176/28
match=40.83.204.240/28


; ═══════════════════════════════════════════════════════════════════════════
; Dialplan mẫu – thêm vào extensions.conf
; ═══════════════════════════════════════════════════════════════════════════
;
; [from-pstn]
; ; Cuộc gọi từ PSTN vào → chuyển sang OpenAI qua SIP trunk
; exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} → OpenAI Voice Bot)
;  same => n,Dial(PJSIP/<PROJECT_ID>@openai-trunk,30)
;  same => n,Hangup()
;
; [from-openai]
; ; Trường hợp OpenAI refer call về Asterisk (chuyển tổng đài viên)
; ; Voice bot gọi refer với target_uri: sip:200@<asterisk_ip>
; exten => 200,1,NoOp(Chuyển từ AI sang tổng đài viên)
;  same => n,Queue(cskh_queue,t,,60)  ; Hàng đợi tổng đài viên
;  same => n,Voicemail(100@default,u)  ; Nếu không ai bắt → hộp thư thoại
;  same => n,Hangup()
